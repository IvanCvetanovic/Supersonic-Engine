name: CI

# The engine did not compile for six commits because nothing ever built it.
# This is the cheapest possible guard against that happening again.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (MSVC)
            os: windows-latest
            # No -G: the runner image moves to a newer Visual Studio over time,
            # and pinning "Visual Studio 17 2022" fails outright the moment it
            # does - which is what happened. CMake's default generator on
            # Windows is the newest Visual Studio actually installed, so letting
            # it choose is both correct today and correct after the next bump.
            preset_args: -A x64
            config: Debug
            jobs: 4
          - name: Linux (GCC)
            os: ubuntu-latest
            # Release, unlike the Windows job, for two reasons. Debug's -O0 -g
            # debug info is a large share of each cc1plus's peak memory, and
            # this runner has already been killed by the OOM reaper once - and
            # a matrix that builds Debug on one platform and Release on the
            # other covers more than one that builds Debug twice.
            preset_args: -DCMAKE_BUILD_TYPE=Release
            config: Release
            # Deliberately 2, not "as many as possible" - see the Build step.
            jobs: 2

    steps:
      - uses: actions/checkout@v4

      # GLFW needs X11/Wayland development headers to configure on Linux, and
      # ALSA's headers are what decide whether the engine gets a real audio
      # backend there or compiles its documented no-op.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev pkg-config \
            libasound2-dev

      # Supplies glslc so the shader build step runs, and the validation layers.
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          cache: true

      # GLFW 3.4 defaults GLFW_BUILD_WAYLAND=ON and hard-fails at configure with
      # FATAL_ERROR "Failed to find wayland-scanner" unless the full Wayland
      # toolchain is present. X11 is enough for CI.
      - name: Configure
        run: cmake -S . -B build ${{ matrix.preset_args }} ${{ runner.os == 'Linux' && '-DGLFW_BUILD_WAYLAND=OFF' || '' }}

      # --parallel with NO number hands make a bare -j, which means unbounded
      # parallelism. Roughly forty translation units then compile at once, each
      # pulling in vulkan.hpp, and the runner's memory does not survive it: the
      # OOM killer takes cc1plus and the job dies with "Killed signal terminated
      # program cc1plus", which reads like a compiler crash rather than the
      # resource exhaustion it is.
      #
      # A concrete job count bounds peak memory. Two matches the Linux runner's
      # core count and leaves headroom for the heaviest translation units.
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel ${{ matrix.jobs }}

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

      # A headless runner has no GPU, so the engine itself cannot be launched.
      # Confirming the binary and its assets exist still catches packaging slips.
      - name: Check build outputs
        shell: bash
        run: |
          set -euo pipefail
          # Location-agnostic: multi-config generators nest outputs under the
          # configuration directory, single-config ones do not, and the plugin
          # sets its own per-config output path.
          find build -name 'SupersonicEngine' -o -name 'SupersonicEngine.exe' | grep -q . \
            || { echo "engine binary not found"; exit 1; }
          find build -name 'GameScripts*' -type f | grep -q . \
            || { echo "script plugin not found"; exit 1; }

          # Read from CMakeLists rather than repeating the list here. The
          # hardcoded copy this replaces was written through a shell heredoc
          # that ate its line continuations, leaving a literal "\n" in the loop
          # - so the step looked for assets/shaders/n.spv and failed every run
          # on both platforms for weeks, long after the build itself was fine.
          # A list that cannot be mistyped cannot rot.
          declared=$(grep -oE '"[a-z_]+\.(vert|frag)=[a-z_]+\.spv"' CMakeLists.txt | tr -d '"')
          test -n "$declared" \
            || { echo "no shader jobs found in CMakeLists.txt - has SHADER_JOBS moved?"; exit 1; }

          while IFS= read -r job; do
            out="${job##*=}"
            test -f "assets/shaders/$out" || { echo "missing assets/shaders/$out"; exit 1; }
          done <<< "$declared"

          echo "Build outputs present."

  shader-check:
    name: Shaders compile from source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          cache: true

      # The committed .spv blobs must actually correspond to the GLSL sources.
      # compile_shaders.bat could never regenerate the grid shaders, so they
      # could drift from their source indefinitely.
      #
      # The pairs come from CMakeLists rather than a copy kept in step with it
      # by hand. There used to be a second step here whose whole job was to
      # compare this list against that one, which is only necessary while there
      # are two lists - and it was itself four shaders out of date, failing
      # every run.
      - name: Recompile every shader
        run: |
          set -euo pipefail
          declared=$(grep -oE '"[a-z_]+\.(vert|frag)=[a-z_]+\.spv"' CMakeLists.txt | tr -d '"')
          test -n "$declared" \
            || { echo "no shader jobs found in CMakeLists.txt - has SHADER_JOBS moved?"; exit 1; }

          while IFS= read -r job; do
            src="${job%%=*}"
            out="${job##*=}"
            echo "Compiling $src"
            glslc "assets/shaders/$src" -o "/tmp/$out"
          done <<< "$declared"

          echo "All shaders compile cleanly."

      # The other direction: a shader sitting in assets/shaders that CMake never
      # compiles is a source the engine may well be loading a stale blob for.
      - name: Every shader source is built by CMake
        run: |
          set -euo pipefail
          declared=$(grep -oE '"[a-z_]+\.(vert|frag)=' CMakeLists.txt | tr -d '"=' | sort)
          onDisk=$(cd assets/shaders && ls *.vert *.frag | sort)

          if [ "$declared" != "$onDisk" ]; then
            echo "assets/shaders and CMakeLists.txt disagree about which shaders exist:"
            echo "  < only in CMakeLists   > only on disk"
            diff <(echo "$declared") <(echo "$onDisk") || true
            exit 1
          fi
          echo "Every shader source is compiled by the build."
