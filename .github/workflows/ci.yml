name: CI

# The engine did not compile for six commits because nothing ever built it.
# This is the cheapest possible guard against that happening again.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (MSVC)
            os: windows-latest
            # No -G: the runner image moves to a newer Visual Studio over time,
            # and pinning "Visual Studio 17 2022" fails outright the moment it
            # does - which is what happened. CMake's default generator on
            # Windows is the newest Visual Studio actually installed, so letting
            # it choose is both correct today and correct after the next bump.
            preset_args: -A x64
            config: Debug
          - name: Linux (GCC)
            os: ubuntu-latest
            preset_args: -DCMAKE_BUILD_TYPE=Debug
            config: Debug

    steps:
      - uses: actions/checkout@v4

      # GLFW needs X11/Wayland development headers to configure on Linux.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev pkg-config

      # Supplies glslc so the shader build step runs, and the validation layers.
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          cache: true

      # GLFW 3.4 defaults GLFW_BUILD_WAYLAND=ON and hard-fails at configure with
      # FATAL_ERROR "Failed to find wayland-scanner" unless the full Wayland
      # toolchain is present. X11 is enough for CI.
      - name: Configure
        run: cmake -S . -B build ${{ matrix.preset_args }} ${{ runner.os == 'Linux' && '-DGLFW_BUILD_WAYLAND=OFF' || '' }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

      # A headless runner has no GPU, so the engine itself cannot be launched.
      # Confirming the binary and its assets exist still catches packaging slips.
      - name: Check build outputs
        shell: bash
        run: |
          set -euo pipefail
          # Location-agnostic: multi-config generators nest outputs under the
          # configuration directory, single-config ones do not, and the plugin
          # sets its own per-config output path.
          find build -name 'SupersonicEngine' -o -name 'SupersonicEngine.exe' | grep -q . \
            || { echo "engine binary not found"; exit 1; }
          find build -name 'GameScripts*' -type f | grep -q . \
            || { echo "script plugin not found"; exit 1; }
          # Every blob CMake knows how to build, not just the first four. The
          # shadow pass was missing here while it was being rewritten for
          # cascades and skinning - precisely when a missing blob would have
          # mattered most.
          for spv in vert frag grid_vert grid_frag shadow_vert shadow_frag; do
            test -f "assets/shaders/$spv.spv" || { echo "missing assets/shaders/$spv.spv"; exit 1; }
          done
          echo "Build outputs present."

  shader-check:
    name: Shaders compile from source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          cache: true

      # The committed .spv blobs must actually correspond to the GLSL sources.
      # compile_shaders.bat could never regenerate the grid shaders, so they
      # could drift from their source indefinitely.
      #
      # Every shader CMake knows how to build is listed, not a subset: the two
      # shadow shaders were missing from this loop while they were being
      # rewritten for cascades and skinning, which is exactly when a shader that
      # no longer compiles would have gone unnoticed.
      - name: Recompile every shader
        run: |
          set -euo pipefail
          for pair in "shader.vert:vert.spv" "shader.frag:frag.spv" \
                      "grid.vert:grid_vert.spv" "grid.frag:grid_frag.spv" \
                      "shadow.vert:shadow_vert.spv" "shadow.frag:shadow_frag.spv"; do
            src="${pair%%:*}"
            out="${pair##*:}"
            echo "Compiling $src"
            glslc "assets/shaders/$src" -o "/tmp/$out"
          done
          echo "All shaders compile cleanly."

      # Every shader CMake compiles must be in the list above. A new shader
      # added to SHADER_JOBS and not added here would otherwise never be checked.
      - name: Shader list matches CMakeLists
        run: |
          set -euo pipefail
          declared=$(grep -oE '"[a-z_]+\.(vert|frag)=' CMakeLists.txt | tr -d '"=' | sort)
          checked=$(printf '%s\n' shader.vert shader.frag grid.vert grid.frag shadow.vert shadow.frag | sort)
          if [ "$declared" != "$checked" ]; then
            echo "CMakeLists.txt builds a different set of shaders than CI checks:"
            diff <(echo "$declared") <(echo "$checked") || true
            exit 1
          fi
          echo "Shader lists agree."
