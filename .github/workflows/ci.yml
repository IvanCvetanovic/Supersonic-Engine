name: CI

# The engine did not compile for six commits because nothing ever built it.
# This is the cheapest possible guard against that happening again.

# ---------------------------------------------------------------------------
# AUTOMATIC RUNS ARE OFF.
#
# Disabled on 2026-08-19 because this repository was close to its GitHub
# Actions minutes allowance, not because anything here is wrong. The jobs are
# intact and unchanged; only the triggers were removed.
#
# To run it: Actions -> CI -> "Run workflow". That still builds Windows and
# Linux, runs the suites, recompiles and byte-compares every shader, runs the
# sanitizer and validation legs, and checks the documented counts.
#
# DISPATCH ONLY, deliberately. This repository is private, so every automatic
# run is charged, and the owner has chosen not to spend that.
#
# What that costs is worth writing down rather than discovering again. Automatic
# runs were off from 19 August, and in those ten days the documented suite count
# drifted from 36 to 61 while `doc-facts` - the job built to catch exactly that -
# sat waiting to be dispatched by hand. A gate nobody triggers reports on
# request, which is what a person does anyway once they already suspect
# something.
#
# So the checks that must not wait for a dispatch do not live here. See
# `tools/verify-replay` for the determinism round trip, which runs locally in
# under a minute and needs no runner.
#
# To turn automatic runs back on, restore:
#
#   push:
#     branches: ["**"]
#   pull_request:
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      legs:
        description: >-
          Which jobs to run. "quick" is the shader byte-compare and the
          documented-counts check, about a minute between them, for when the
          builds are not worth the minutes. "all" is everything, as before.
          "arm64" is one job and nothing else: it builds the engine on a Linux
          arm64 runner and runs every suite there, which is what finally says
          whether the pinned determinism hash holds off x86 (it has never been
          run there). Not part of "all": it needs a runner label the account may
          not have, and a job that waits for one forever should not hold the rest.
        type: choice
        default: all
        options:
          - all
          - quick
          - arm64

# Nothing here writes to the repository or to anything it hosts.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.legs }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    # A cap, not an expectation: a hung suite otherwise holds a runner for
    # GitHub's default six hours, out of the allowance that is the reason
    # automatic runs are off. Set generously from what these builds are
    # known to cost, so a slow day is not a red one; tighten after real runs.
    if: ${{ inputs.legs != 'quick' && inputs.legs != 'arm64' }}
    timeout-minutes: 90
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (MSVC)
            os: windows-latest
            # No -G: the runner image moves to a newer Visual Studio over time,
            # and pinning "Visual Studio 17 2022" fails outright the moment it
            # does - which is what happened. CMake's default generator on
            # Windows is the newest Visual Studio actually installed, so letting
            # it choose is both correct today and correct after the next bump.
            preset_args: -A x64
            config: Debug
            jobs: 4
          - name: Linux (GCC)
            os: ubuntu-latest
            # Release, unlike the Windows job, for two reasons. Debug's -O0 -g
            # debug info is a large share of each cc1plus's peak memory, and
            # this runner has already been killed by the OOM reaper once - and
            # a matrix that builds Debug on one platform and Release on the
            # other covers more than one that builds Debug twice.
            preset_args: -DCMAKE_BUILD_TYPE=Release
            config: Release
            # Deliberately 2, not "as many as possible" - see the Build step.
            jobs: 2

    steps:
      - uses: actions/checkout@v4

      # GLFW needs X11/Wayland development headers to configure on Linux, and
      # ALSA's headers are what decide whether the engine gets a real audio
      # backend there or compiles its documented no-op.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev pkg-config \
            libasound2-dev

      # Supplies glslc so the shader build step runs, and the validation layers.
      # Pinned, not "latest". glslc's output is not guaranteed bit-stable
      # across shaderc releases, and the step below compares the committed
      # SPIR-V byte for byte - so an unpinned SDK would turn an upstream
      # release into a red build with an empty diff. 1.4.357.0 is the version
      # the committed blobs reproduce under.
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.357.0
          cache: true

      # GLFW 3.4 defaults GLFW_BUILD_WAYLAND=ON and hard-fails at configure with
      # FATAL_ERROR "Failed to find wayland-scanner" unless the full Wayland
      # toolchain is present. X11 is enough for CI.
      - name: Configure
        run: cmake -S . -B build ${{ matrix.preset_args }} ${{ runner.os == 'Linux' && '-DGLFW_BUILD_WAYLAND=OFF' || '' }}

      # --parallel with NO number hands make a bare -j, which means unbounded
      # parallelism. Roughly forty translation units then compile at once, each
      # pulling in vulkan.hpp, and the runner's memory does not survive it: the
      # OOM killer takes cc1plus and the job dies with "Killed signal terminated
      # program cc1plus", which reads like a compiler crash rather than the
      # resource exhaustion it is.
      #
      # A concrete job count bounds peak memory. Two matches the Linux runner's
      # core count and leaves headroom for the heaviest translation units.
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel ${{ matrix.jobs }}

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

      # A headless runner has no GPU, so the engine itself cannot be launched.
      # Confirming the binary and its assets exist still catches packaging slips.
      - name: Check build outputs
        shell: bash
        run: |
          set -euo pipefail
          # Location-agnostic: multi-config generators nest outputs under the
          # configuration directory, single-config ones do not, and the plugin
          # sets its own per-config output path.
          # -print -quit inside a substitution, not `find | grep -q .`: grep -q leaves at
          # its first match, find can then take a SIGPIPE, and under pipefail that
          # reports "not found" for something that is there (a plugin build leaves
          # several files: .dll, .lib, .exp, .pdb).
          [ -n "$(find build \( -name 'SupersonicEngine' -o -name 'SupersonicEngine.exe' \) -print -quit)" ] \
            || { echo "engine binary not found"; exit 1; }
          [ -n "$(find build -name 'GameScripts*' -type f -print -quit)" ] \
            || { echo "script plugin not found"; exit 1; }

          # Read from CMakeLists rather than repeating the list here. The
          # hardcoded copy this replaces was written through a shell heredoc
          # that ate its line continuations, leaving a literal "\n" in the loop
          # - so the step looked for assets/shaders/n.spv and failed every run
          # on both platforms for weeks, long after the build itself was fine.
          # A list that cannot be mistyped cannot rot.
          declared=$(grep -oE '"[a-z_]+\.(vert|frag)=[a-z_]+\.spv"' CMakeLists.txt | tr -d '"')
          test -n "$declared" \
            || { echo "no shader jobs found in CMakeLists.txt - has SHADER_JOBS moved?"; exit 1; }

          while IFS= read -r job; do
            out="${job##*=}"
            test -f "assets/shaders/$out" || { echo "missing assets/shaders/$out"; exit 1; }
          done <<< "$declared"

          echo "Build outputs present."

  shader-check:
    name: Shaders compile from source
    if: ${{ inputs.legs != 'arm64' }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, not "latest". glslc's output is not guaranteed bit-stable
      # across shaderc releases, and the step below compares the committed
      # SPIR-V byte for byte - so an unpinned SDK would turn an upstream
      # release into a red build with an empty diff. 1.4.357.0 is the version
      # the committed blobs reproduce under.
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.357.0
          cache: true

      # The committed .spv blobs must actually correspond to the GLSL sources, and
      # every shader source on disk must be one CMake builds. The pairs come from
      # CMakeLists rather than a copy kept in step with it by hand.
      #
      # The logic lives in tools/check.sh, which CI calls and a person runs
      # locally with `tools/check.sh shaders`: this job used to carry its own copy
      # of the script, and two copies of a check are how a check goes stale.
      - name: Recompile every shader, and check the list
        run: bash tools/check.sh shaders

  # ---------------------------------------------------------------------------
  # Validation layers, under a software rasteriser.
  #
  # ARCHITECTURE.md records two showstopper bugs that survived six commits
  # because validation was silently unavailable, and README.md has to make
  # "validation clean before commit" a manual convention. It was manual because
  # there was nothing to automate: main() took no arguments, so the engine could
  # only be run by a human closing its window, and this workflow said as much -
  # "a headless runner has no GPU, so the engine itself cannot be launched".
  #
  # It can now. --frames renders a fixed count and exits, an ERROR-severity
  # validation message increments a counter, and main() returns EXIT_FAILURE if
  # that counter is non-zero.
  #
  # continue-on-error until this has proven itself over a few runs: lavapipe
  # must report an apiVersion of at least 1.2 for instance creation to succeed,
  # and that is a property of whichever Mesa the runner image ships rather than
  # something this file controls. Turn it off once the job has been green for a
  # while. A gate nobody trusts gets ignored; a gate that fails for reasons its
  # author cannot fix gets deleted, which is worse.
  validation:
    name: Validation layers (lavapipe)
    if: ${{ inputs.legs != 'quick' && inputs.legs != 'arm64' }}
    timeout-minutes: 45
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies and a software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev pkg-config \
            libasound2-dev mesa-vulkan-drivers vulkan-tools xvfb

      # Found, not named: Ubuntu 24.04's release Mesa installs lvp_icd.x86_64.json and
      # its updates install lvp_icd.json, and a loader pointed at a file that is not
      # there reports "no drivers" - every step below then fails, or (before
      # SUPERSONIC_REQUIRE_DEVICE) skipped. Failing here says what is wrong.
      - name: Locate the software Vulkan driver
        run: |
          icd="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd" || { echo "no lavapipe ICD under /usr/share/vulkan/icd.d" >&2; exit 1; }
          echo "Using $icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.357.0
          cache: true

      # SUPERSONIC_ENABLE_VALIDATION=ON rather than simply building Debug.
      # Validation used to be tied to NDEBUG, and this job builds Release for
      # the same documented reason the Linux build job does: the runner's
      # memory does not survive Debug's debug info across forty translation
      # units. Tying the layers to the build type is exactly what stopped the
      # one job that could have run them from being able to.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGLFW_BUILD_WAYLAND=OFF \
            -DSUPERSONIC_ENABLE_VALIDATION=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Report the driver actually in use
        run: xvfb-run -a vulkaninfo --summary || echo "vulkaninfo unavailable; continuing"

      # From the project root: asset paths resolve against the working
      # directory. A non-zero exit is either a validation error or a crash,
      # and this job should fail on both.
      - name: Run 120 frames under validation
        env:
          VK_LAYER_VALIDATE_SYNC: "1"
        run: xvfb-run -a ./build/SupersonicEngine --frames 120

      # What a renderer or simulation change can break that no unit test sees, run
      # under the same software device and the same validation layers. Each script
      # carries a negative control (a later frame must differ; a corrupted
      # checkpoint must be caught), so a green run means the check could have
      # failed. See the scripts for why none of it pins a picture.
      - name: Frames are repeatable, and a later frame differs
        run: bash tools/verify-frames.sh --exe build/SupersonicEngine

      - name: The replay reproduces, and a corrupted checkpoint is caught
        run: bash tools/verify-replay.sh --exe build/SupersonicEngine

      # The suites that need a device: uploads, the texture and mesh registries,
      # the pipeline cache, the deferred-destroy queue. They skip, loudly, where
      # there is no device; here there is one, so a skip is a failure
      # (SUPERSONIC_REQUIRE_DEVICE) - otherwise a regression in creating the device
      # would turn this step green by skipping it.
      - name: Device-backed suites
        env:
          SUPERSONIC_REQUIRE_DEVICE: "1"
        run: xvfb-run -a ctest --test-dir build -L device --no-tests=error --output-on-failure

  # ---------------------------------------------------------------------------
  # Sanitizers over the existing suites.
  #
  # Not speculative coverage: the suites already feed malformed input to the
  # code most likely to run off the end of a buffer - a truncated WAV ("must be
  # rejected, not read out of bounds"), malformed glTF, and a malformed scene
  # through a hand-written JSON parser with no depth limit.
  sanitizers:
    name: ASan + UBSan (Linux)
    if: ${{ inputs.legs != 'quick' && inputs.legs != 'arm64' }}
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev pkg-config libasound2-dev

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.357.0
          cache: true

      # RelWithDebInfo: the sanitizers need frame pointers and symbols to
      # produce a readable report, and a -O0 build of this tree is what the OOM
      # killer takes on this runner.
      #
      # No -fno-sanitize-recover, but UBSan is made fatal at RUN time below. This
      # job used to let undefined behaviour print and carry on, so a report
      # exited 0 and the job stayed green - and it ran with leak detection off.
      # The worry that kept it that way was the vendored tinygltf and ImGui
      # translation units, compiled here too: a fatal UBSan inside somebody
      # else's parser would make the job a report about third-party code. Measured
      # on 1 October 2026, over every suite, with UBSan halting and leaks fatal:
      # no findings at all. If that stops being true, this is where to look
      # first - a finding in third_party/ is a reason to suppress it by name, not
      # to go back to a job that cannot fail.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DGLFW_BUILD_WAYLAND=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -D_GLIBCXX_ASSERTIONS" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel 2

      # The suites only. The engine itself needs a device, and a driver's own
      # allocations under ASan are somebody else's report.
      - name: Test
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

  # ---------------------------------------------------------------------------
  # The build configurations the documentation advertises and nothing built.
  # SUPERSONIC_BUILD_TESTS and SUPERSONIC_BUILD_SCRIPT_PLUGIN are documented
  # knobs; an option no job ever sets to OFF compiles by accident until the day
  # it does not.
  options-off:
    name: Configure with tests and plugin OFF
    if: ${{ inputs.legs != 'quick' && inputs.legs != 'arm64' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev pkg-config libasound2-dev

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.357.0
          cache: true

      - name: Configure and build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGLFW_BUILD_WAYLAND=OFF \
            -DSUPERSONIC_BUILD_TESTS=OFF \
            -DSUPERSONIC_BUILD_SCRIPT_PLUGIN=OFF
          cmake --build build --parallel 2

  # ---------------------------------------------------------------------------
  # Does the simulation reproduce off x86?
  #
  # test_determinism pins the hash of four seconds of its fixture scene as one
  # number, and it holds across compilers and C runtimes (MSVC on the UCRT, GCC on
  # glibc). Every measurement behind that was x64. ARM64 has different fused
  # multiply-add behaviour in the hardware and different libm code paths, and the
  # simulation avoids both by construction (-ffp-contract=off, DetMath) - which is a
  # claim until something runs it. This runs every suite on a Linux arm64 runner:
  # green means the pinned hash held, red means it did not and the first failing
  # suite says where.
  #
  # Dispatch with legs = arm64. No Vulkan SDK (none is published for arm64 Linux):
  # the build uses the vendored headers and the loader from libvulkan-dev, and the
  # committed shader blobs. The editor is not built, only the library and the suites.
  arm64:
    name: Suites on Linux arm64
    if: ${{ inputs.legs == 'arm64' }}
    timeout-minutes: 90
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev pkg-config libasound2-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGLFW_BUILD_WAYLAND=OFF \
            -DSUPERSONIC_BUILD_EDITOR=OFF \
            -DSUPERSONIC_BUILD_SCRIPT_PLUGIN=OFF \
            -DSUPERSONIC_WERROR=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Run every suite
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # Documentation that counts things must count them rather than remember them.
  #
  # AGENTS.md said eleven suites, CONTRIBUTING.md fourteen, README.md sixteen,
  # and the build registered twenty-three - four numbers, three of them wrong,
  # in a repository whose stated thesis is that its documentation does not
  # quietly contradict its code. A number maintained by hand is a number that
  # rots; this makes the build the only place the number lives.
  doc-facts:
    name: Documented counts match the build
    if: ${{ inputs.legs != 'arm64' }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The logic lives in tools/check.sh, which CI calls and a person runs locally
      # with `tools/check.sh docs`. Besides the suite count in the prose and the
      # badge it now checks that every suite has a row in the README's Testing
      # table and that every tests/test_*.cpp is registered.
      - name: Documented counts, badge, table and registrations
        run: bash tools/check.sh docs
