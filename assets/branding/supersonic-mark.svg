<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Supersonic Engine mark">
  <title>Supersonic Engine</title>
  <defs>
    <!-- Compression side of a shock: bright at the nose, deepening down the body. -->
    <linearGradient id="m-wedge" x1="430" y1="196" x2="164" y2="336" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC59A"/>
      <stop offset="0.28" stop-color="#FF7A3D"/>
      <stop offset="1" stop-color="#D6420A"/>
    </linearGradient>
    <linearGradient id="m-facet" x1="430" y1="270" x2="180" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B33307"/>
      <stop offset="1" stop-color="#7A1F03"/>
    </linearGradient>
    <linearGradient id="m-shock" x1="20" y1="256" x2="150" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E9AB0"/>
      <stop offset="1" stop-color="#4FE3F2"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="#14171C"/>

  <!-- Trailing shock front. Three fronts, bulging away from travel, thinning
       and fading with distance - the wake reads as motion without any blur. -->
  <g fill="none" stroke="url(#m-shock)" stroke-linecap="round">
    <path d="M 134 158 Q 82 256 134 354" stroke-width="17" opacity="0.95"/>
    <path d="M 100 134 Q 46 256 100 378" stroke-width="12" opacity="0.6"/>
    <path d="M 72 114 Q 18 256 72 398" stroke-width="7" opacity="0.32"/>
  </g>

  <!-- Flight line: the undisturbed axis the shock is measured against. -->
  <path d="M 66 256 H 452" stroke="#6B7A85" stroke-width="3" opacity="0.35"/>

  <!-- Mach dart. Notched tail so the silhouette reads as swept, not as a
       generic triangle. -->
  <path d="M 436 256 L 158 146 L 214 256 L 158 366 Z" fill="url(#m-wedge)"/>
  <!-- Lower facet, to give the body a lit edge and a shaded one. -->
  <path d="M 436 256 L 214 256 L 158 366 Z" fill="url(#m-facet)" opacity="0.85"/>
  <!-- Leading highlight along the compression edge. -->
  <path d="M 436 256 L 158 146" stroke="#FFE0C6" stroke-width="5" stroke-linecap="round" opacity="0.75" fill="none"/>
</svg>
