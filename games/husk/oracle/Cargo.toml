# The oracle the C++ port of HUSK's simulation is held to.
#
# It links the game itself, by path and with the headless feature, so every
# number it prints comes from HUSK's own code. It lives on this side so the
# game's repository is never edited. See docs/planning/2026-09-10-husk-port.md.
#
# The path assumes the two repositories sit side by side, as they do on the
# desktop (Desktop/Supersonic-Engine and Desktop/Test-Game).
#
# Cargo.lock started as a copy of HUSK's own at 721e19e, so glam and every
# other shared dependency resolve to exactly the versions the game was built
# with. A newer glam would be a different oracle.

[package]
name = "husk-oracle"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
project-husk = { path = "../../../../Test-Game", default-features = false, features = ["headless"] }
bevy = { version = "=0.18.1", default-features = false, features = ["std", "serialize"] }
# For the `install` verb: a scenario's own mission file, parsed as the game does.
ron = "0.12.1"

# Standalone: never part of a workspace above it.
[workspace]
